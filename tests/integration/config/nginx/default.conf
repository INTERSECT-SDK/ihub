# Thin front door for the integration stack: only the routes the tests use.
#
# Upstreams are resolved per request through Docker's DNS (proxy_pass with a
# variable), so services recreated by `docker compose up` with a changed
# environment (e.g. toggling IT_BROKER) are picked up without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 8080;
  server_name _;

  set $ui http://ui:3000;
  set $server http://server:8000;
  set $keycloak http://keycloak:8080;
  set $mcp http://mcp:8100;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location /hub {
    proxy_pass $ui;
  }

  location /api {
    proxy_pass $server;
  }

  location /auth/ {
    proxy_pass $keycloak;
  }

  location /ihub_mcp/ {
    rewrite ^/ihub_mcp/(.*)$ /$1 break;
    proxy_pass $mcp;
    proxy_buffering off;
  }
}
