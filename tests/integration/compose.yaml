# Minimal, ephemeral iHub stack for integration tests.
#
# Runs only the core iHub pieces (ui, server, mcp, database, redis) plus a
# local Keycloak with a pre-imported test realm and a thin Nginx front door. No
# orchestrator, JupyterHub, or Ollama is started, and the broker is opt-in: the
# stack should come up without them. Nothing is persisted between runs (no
# named volumes).
#
#   docker compose -f tests/integration/compose.yaml up --build --detach --wait
#   pdm run -p tests/integration pytest tests/integration
#     (or, without host Python, as CI does:
#      docker compose -f tests/integration/compose.yaml run --rm tests)
#   docker compose -f tests/integration/compose.yaml down --volumes
#
# IT_PORT sets the host port of the Nginx front door (default 18080).
# IT_BROKER=1 adds a RabbitMQ broker and has the server seed it on startup;
# re-running `up` with it toggled recreates only the affected services.

name: ihub-it

services:
  database:
    image: bitnamilegacy/postgresql:17
    environment:
      POSTGRESQL_USERNAME: ihub_username
      POSTGRESQL_PASSWORD: ihub_password
      POSTGRESQL_DATABASE: ihub
    healthcheck:
      test: pg_isready -U ihub_username -d ihub
      interval: 5s
      retries: 20
      timeout: 5s

  redis:
    image: redis:8.6-trixie
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 20
      timeout: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      # Browser-facing URL goes through nginx; the server reaches Keycloak on
      # the internal network, so allow dynamic backchannel hostnames.
      KC_HOSTNAME: http://localhost:${IT_PORT:-18080}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    volumes:
      - ./config/keycloak/ihub-realm.json:/opt/keycloak/data/import/ihub-realm.json:ro
    healthcheck:
      # The image has no curl/wget; probe the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      retries: 40
      start_period: 10s
      timeout: 5s

  server:
    build:
      context: ../../apps/backend/server
      target: runtime
      args:
        PRODUCTION: '1'
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import httpx; httpx.get('http://localhost:8000/openapi.json', timeout=5).raise_for_status()
      interval: 5s
      retries: 30
      start_period: 10s
      timeout: 10s
    environment:
      LOG_LEVEL: INFO
      ENVIRONMENT: production
      AUTH_MODE: oauth
      CORS_ORIGINS: '["*"]'
      VERSION: IT
      POSTGRESQL_USERNAME: ihub_username
      POSTGRESQL_PASSWORD: ihub_password
      POSTGRESQL_HOST: database
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: ihub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PROTOCOL: 3
      REDIS_DECODE_RESPONSES: 'True'
      # Seed broker: with IT_BROKER=1 the server creates and connects the local
      # RabbitMQ on startup. Otherwise these interpolate to empty strings, which
      # the server treats as unset, so it runs with no broker configuration.
      BROKER_ENABLED: ${IT_BROKER:+true}
      BROKER_LABEL: IT Broker
      BROKER_HOST: ${IT_BROKER:+broker}
      BROKER_PORT: ${IT_BROKER:+5672}
      BROKER_USERNAME: ${IT_BROKER:+intersect_username}
      BROKER_PASSWORD: ${IT_BROKER:+intersect_password}
      BROKER_PROTOCOL: ${IT_BROKER:+amqp0.9.1}
      JH_HOST: http://unused
      JH_ADMIN_TOKEN: unused
      SESSION_SECRET: it-session-secret
      SCOPE: openid email
      CLIENT_ID: ihub
      CLIENT_SECRET: ihub-it-client-secret
      keycloak_authorize_url: http://localhost:${IT_PORT:-18080}/auth/realms/ihub/protocol/openid-connect/auth
      keycloak_token_url: http://keycloak:8080/auth/realms/ihub/protocol/openid-connect/token
      keycloak_jwks_url: http://keycloak:8080/auth/realms/ihub/protocol/openid-connect/certs
      OAUTH_CALLBACK_URL: http://localhost:${IT_PORT:-18080}/api/v1/auth/callback
      OAUTH_REDIRECT_URL: http://localhost:${IT_PORT:-18080}/hub/auth
      OAUTH_UNAUTHORIZED_REDIRECT_URL: http://localhost:${IT_PORT:-18080}/hub/unauthorized
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
        required: false

  # Optional INTERSECT broker, started only when IT_BROKER=1.
  broker:
    image: bitnamilegacy/rabbitmq:4.1
    scale: ${IT_BROKER:-0}
    environment:
      RABBITMQ_USERNAME: intersect_username
      RABBITMQ_PASSWORD: intersect_password
      # Bitnami restricts the user to localhost connections unless this is set.
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: 'yes'
    healthcheck:
      test: rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running
      interval: 5s
      retries: 30
      start_period: 10s
      timeout: 10s

  mcp:
    build:
      context: ../../apps/backend/mcp_server
      target: runtime
      args:
        PRODUCTION: '1'
    environment:
      PORT: 8100
      IHUB_SERVER_HOST: server
      IHUB_SERVER_PORT: 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 8100), 2).close()
      interval: 5s
      retries: 20
      timeout: 5s

  # Only pre-authorized emails may log in via OAuth; authorize the realm's
  # test user once the server has run its migrations.
  authorize-test-user:
    image: bitnamilegacy/postgresql:17
    entrypoint: ['psql']
    command:
      - -h
      - database
      - -U
      - ihub_username
      - -d
      - ihub
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        INSERT INTO authorizeduser (id, email, is_active, created_at)
        VALUES (gen_random_uuid(), 'it.user@example.com', true, now())
        ON CONFLICT (email) DO NOTHING;
    environment:
      PGPASSWORD: ihub_password
    restart: 'no'
    depends_on:
      server:
        condition: service_healthy

  ui:
    build:
      context: ../..
      dockerfile: ./apps/frontend/hub/Dockerfile
      args:
        APP_NAME: hub
        NEXT_PUBLIC_VERSION: IT
    environment:
      PORT: 3000
    healthcheck:
      # Next standalone binds to $HOSTNAME (the container id), not localhost.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://' + require('os').hostname() + ':3000/hub/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      retries: 20
      timeout: 5s

  nginx:
    image: nginx:1.29-alpine
    ports:
      - '${IT_PORT:-18080}:8080'
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: wget -q --spider http://127.0.0.1:8080/hub/login
      interval: 5s
      retries: 20
      timeout: 5s
    depends_on:
      ui:
        condition: service_healthy
      server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mcp:
        condition: service_healthy
      authorize-test-user:
        condition: service_completed_successfully

  # Test runner, so no host Python is needed (used by CI). Opt-in via profile;
  # host networking lets it reach the stack at localhost:$IT_PORT like a
  # browser, which the Keycloak redirect URLs require.
  tests:
    image: python:3.12-slim
    profiles: [tests]
    network_mode: host
    working_dir: /tests
    volumes:
      - ./:/tests:ro
    environment:
      IT_PORT: ${IT_PORT:-18080}
      IT_BROKER: ${IT_BROKER:-}
      PDM_CHECK_UPDATE: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_ROOT_USER_ACTION: ignore
    # PDM writes into the project it exports from, so export the locked
    # requirements from a scratch copy and keep the mount read-only.
    command:
      - sh
      - -ec
      - |
        pip install --quiet pdm
        mkdir /tmp/deps
        cp pyproject.toml pdm.lock /tmp/deps/
        pdm export -p /tmp/deps --no-hashes --prod --output /tmp/requirements.txt
        pip install --quiet --requirement /tmp/requirements.txt
        pytest -p no:cacheprovider
    depends_on:
      nginx:
        condition: service_healthy
