services:
  projects-volume-init:
    container_name: ihub-projects-volume-init
    image: busybox:1.36
    command: sh -c "mkdir -p /projects && chown -R 1000:100 /projects && find /projects -type d -exec chmod 2775 {} + && find /projects -type f -exec chmod 0664 {} +"
    restart: 'no'
    volumes:
      - ihub_projects:/projects

  ui:
    container_name: ihub-ui
    build:
      context: .
      dockerfile: ./apps/frontend/hub/Dockerfile
      args:
        APP_NAME: hub
        NEXT_PUBLIC_VERSION: ${VERSION}
    environment:
      PORT: 3000
    restart: always
    ports:
      - 3000:3000
    networks:
      - internal

  marketplace:
    container_name: ihub-marketplace
    build:
      context: .
      dockerfile: ./apps/frontend/marketplace/Dockerfile
      args:
        APP_NAME: marketplace
        NEXT_PUBLIC_VERSION: ${VERSION}
    environment:
      PORT: 3001
    restart: always
    ports:
      - "3001:3001"
    networks:
      - internal

  docs:
    container_name: ihub-docs
    build:
      context: ./apps/frontend/docs
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3002:3002"
    networks:
      - internal

  server:
    container_name: ihub-server
    build:
      context: ./apps/backend/server
      target: runtime # remove this if you want to run the tests inside the docker build
      args:
        PRODUCTION: "1" # remove this if you want to run tests or lints inside the docker build
    restart: always
    environment:
      LOG_LEVEL: INFO
      ENVIRONMENT: production
      AUTH_MODE: oauth
      PROJECT_FILE_UPLOAD_MAX_BYTES: ${PROJECT_FILE_UPLOAD_MAX_BYTES:-10485760}
      # Broker used for streaming messages: /api/v1/messages/stream
      BROKER_HOST: ${BROKER_HOST}
      BROKER_PORT: ${BROKER_PORT}
      BROKER_USERNAME: ${BROKER_USERNAME}
      BROKER_PASSWORD: ${BROKER_PASSWORD}
      BROKER_PROTOCOL: ${BROKER_PROTOCOL}
      POSTGRESQL_USERNAME: ihub_username
      POSTGRESQL_PASSWORD: ihub_password
      POSTGRESQL_HOST: database
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: ihub
      CORS_ORIGINS: '["*"]'
      REDIS_HOST: ihub-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PROTOCOL: 3
      REDIS_DECODE_RESPONSES: True
      MQ_URI: ${MQ_URI:-redis://ihub-redis:6379}
      KVDB_URI: ${KVDB_URI:-redis://ihub-redis:6379}
      JH_ADMIN_TOKEN: ${JUYTER_HUB_ADMIN_TOKEN}
      JH_HOST: ${JUPYTER_PUBLIC_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SCOPE: ${SCOPE}
      auth_redirect_url: ${auth_redirect_url}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      keycloak_authorize_url: ${keycloak_authorize_url}
      keycloak_token_url: ${keycloak_token_url}
      OAUTH_USERDATA_URL: ${OAUTH_USERDATA_URL}
      keycloak_jwks_url: ${keycloak_jwks_url}
      OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL}
      OAUTH_UNAUTHORIZED_REDIRECT_URL: ${OAUTH_UNAUTHORIZED_REDIRECT_URL}
      RESERVED_BROKER_QUEUE_NAME: ${RESERVED_BROKER_QUEUE_NAME}
      VERSION: ${VERSION}

    ports:
      - "8000:8000"
    depends_on:
      - database
    networks:
      - internal

  database:
    container_name: ihub-database
    image: bitnamilegacy/postgresql:17
    # full list of environment variables available at https://github.com/bitnami/containers/tree/231cb510c9f39dc7100d2a0c117beaef007f5fac/bitnami/postgresql#environment-variables
    environment:
      POSTGRESQL_USERNAME: ihub_username
      POSTGRESQL_PASSWORD: ihub_password
      POSTGRESQL_DATABASE: ihub
    healthcheck:
      test: pg_isready -U "ihub_username" -d "ihub_password"
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    ports:
      - 5432:5432
    volumes:
      - ihub_postgresql_data:/bitnami/postgresql
    networks:
      - internal
  nginx:
    container_name: ihub-nginx
    build:
      context: ./apps/backend/nginx
    restart: always
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
      PROJECT_FILE_UPLOAD_MAX_BYTES: ${PROJECT_FILE_UPLOAD_MAX_BYTES:-10485760}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ${TLS_CERT_FILE:?TLS_CERT_FILE is required}
        target: /run/secrets/tls_certificate
        read_only: true
      - type: bind
        source: ${TLS_KEY_FILE:?TLS_KEY_FILE is required}
        target: /run/secrets/tls_private_key
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  ihub-jupyterhub:
    build:
      context: ./apps/backend/jupyter_hub
      dockerfile: Dockerfile
      args:
        JUPYTERHUB_VERSION: 5.4.2
    restart: always
    container_name: ihub-jupyterhub
    networks:
      - internal
    volumes:
      # The JupyterHub configuration file
      - "./apps/backend/jupyter_hub/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro"
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - "ihub_jupyter_data:/data"
    depends_on:
      projects-volume-init:
        condition: service_completed_successfully

    ports:
      - "5482:8000"
    environment:
      # This username will be a JupyterHub admin
      JUPYTERHUB_ADMIN: admin
      # All containers will join this network
      DOCKER_NETWORK_NAME: ihub_internal_network
      # JupyterHub will spawn this Notebook image for users
      # DOCKER_NOTEBOOK_IMAGE: quay.io/jupyter/scipy-notebook:hub-5.4.2
      DOCKER_NOTEBOOK_IMAGE: quay.io/jupyterhub/singleuser:5.4.2
      # Notebook directory inside user image
      DOCKER_NOTEBOOK_DIR: /home/jovyan/work
      OAUTH_CLIENT_ID: ${CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${CLIENT_SECRET}
      SCOPE: ${SCOPE}
      OAUTH_AUTHORIZE_URL: ${keycloak_authorize_url}
      OAUTH_TOKEN_URL: ${keycloak_token_url}
      OAUTH_USERDATA_URL: ${OAUTH_USERDATA_URL}
      JUPYTER_OAUTH_CALLBACK_URL: ${JUPYTER_OAUTH_CALLBACK_URL}
      JUPYTER_PUBLIC_URL: ${JUPYTER_PUBLIC_URL}
      JUPYTER_VALIDATE_CERT: ${JUPYTER_VALIDATE_CERT}
      JUPYTERHUB_SECURE_COOKIES: ${JUPYTERHUB_SECURE_COOKIES}
      JUPYTER_SECURE_COOKIES: ${JUPYTER_SECURE_COOKIES}
      AUTH_MODE: oauth
      ENVIRONMENT: production
      JH_ADMIN_TOKEN: ${JUYTER_HUB_ADMIN_TOKEN}

  mcp:
    container_name: ihub-mcp
    environment:
      PORT: 8100
      IHUB_SERVER_HOST: ihub-server
      IHUB_SERVER_PORT: 8000
    build:
      context: ./apps/backend/mcp_server
      target: runtime # remove this if you want to run the tests inside the docker build
      args:
        PRODUCTION: "1" # remove this if you want to run tests or lints inside the docker build
    restart: always
    ports:
      - "8100:8100"
    networks:
      - internal

  redis:
    container_name: ihub-redis
    image: redis:8.6-trixie
    restart: always
    ports:
      - "6379:6379"
    networks:
      - internal
    volumes:
      - ihub_redis_data:/data # Using Azure Open AI model for demo

  ollama:
    container_name: ihub-ollama
    image: ollama/ollama:latest
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ihub_ollama_vol:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Use all available GPUs
              capabilities: [gpu]

  # Can turn off when using remote S3M Flowcept broker
  # flowcept_redis:
  #  container_name: flowcept_redis
  #  image: redis
  #  ports:
  #    - 6379:6379
  #  networks:
  #    - internal

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
  internal:
    name: ihub_internal_network
    driver: bridge

volumes:
  ihub_postgresql_data:
    driver: local
  ihub_ollama_vol:
    driver: local
  ihub_redis_data:
    driver: local
  ihub_jupyter_data:
    driver: local
  ihub_keycloak_data:
    driver: local
  ihub_projects:
    driver: local
