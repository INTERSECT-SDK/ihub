name: Container Images

# Tag pushes (for example v0.119.0) build and publish multi-arch images to
# GHCR. Pull requests that touch container inputs build without pushing so
# broken Dockerfiles are caught before a release tag is cut.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-images.yaml"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "apps/frontend/*/next.config.*"
      - "apps/backend/*/pyproject.toml"
      - "apps/backend/*/pdm.lock"
      - "apps/backend/jupyter_hub/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase.
  IMAGE_PREFIX: ghcr.io/intersect-sdk
  PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        image:
          - name: ihub-ui
            context: .
            dockerfile: apps/frontend/hub/Dockerfile
            target: runner
          - name: ihub-marketplace
            context: .
            dockerfile: apps/frontend/marketplace/Dockerfile
            target: runner
          - name: ihub-docs
            context: apps/frontend/docs
            dockerfile: apps/frontend/docs/Dockerfile
            target: ""
          - name: ihub-server
            context: apps/backend/server
            dockerfile: apps/backend/server/Dockerfile
            target: runtime
          - name: ihub-jupyterhub
            context: apps/backend/jupyter_hub
            dockerfile: apps/backend/jupyter_hub/Dockerfile
            target: ""
          - name: ihub-mcp
            context: apps/backend/mcp_server
            dockerfile: apps/backend/mcp_server/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          # Only "version" is used here (tags are applied in publish). The UI
          # renders "v<version>", so use the bare semver for release builds.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into ${{ env.REGISTRY }}
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ env.PUSH == 'true' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          # Build args that a Dockerfile does not declare are ignored.
          build-args: |
            PRODUCTION=1
            NEXT_PUBLIC_VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          outputs: ${{ env.PUSH == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.image }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - ihub-ui
          - ihub-marketplace
          - ihub-docs
          - ihub-server
          - ihub-jupyterhub
          - ihub-mcp
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # v1.2.3 -> v1.2.3 (matches the tag), 1.2.3, 1.2, and latest.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest and push tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}"
