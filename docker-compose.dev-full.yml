services:
  projects-volume-init:
    container_name: ihub-projects-volume-init
    image: busybox:1.36
    command: sh -c "mkdir -p /projects && chown -R 1000:100 /projects && find /projects -type d -exec chmod 2775 {} + && find /projects -type f -exec chmod 0664 {} +"
    restart: 'no'
    volumes:
      - ihub_projects:/projects

  database:
    container_name: ihub-database
    image: bitnamilegacy/postgresql:17
    # full list of environment variables available at https://github.com/bitnami/containers/tree/231cb510c9f39dc7100d2a0c117beaef007f5fac/bitnami/postgresql#environment-variables
    environment:
      POSTGRESQL_USERNAME: ihub_username
      POSTGRESQL_PASSWORD: ihub_password
      POSTGRESQL_DATABASE: ihub
    healthcheck:
      test: pg_isready -U "ihub_username" -d "ihub_password"
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    ports:
      - "5432:5432"
    volumes:
      - ihub_postgresql_data:/bitnami/postgresql
    networks:
      - internal

  nginx-dev:
    build:
      context: ./apps/backend/nginx_dev
    restart: always
    environment:
      PROJECT_FILE_UPLOAD_MAX_BYTES: ${PROJECT_FILE_UPLOAD_MAX_BYTES:-10485760}
      NGINX_HUB_UPSTREAM: ui:3000
      NGINX_MARKETPLACE_UPSTREAM: marketplace:3001
      NGINX_SERVER_UPSTREAM: server:8000
      NGINX_DOCS_UPSTREAM: docs:3002
      NGINX_MCP_UPSTREAM: mcp:8100
    ports:
      - "8080:8080"
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    depends_on:
      - server
      - ui
      - marketplace
      - docs

  redis:
    container_name: ihub-redis
    image: redis:8.6-trixie
    restart: always
    ports:
      - "6379:6379"
    networks:
      - internal
    volumes:
      - ihub_redis_data:/data

  broker:
    container_name: ihub-broker
    image: "bitnamilegacy/rabbitmq:4.1"
    restart: always
    ports:
      - "1883:1883"
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_mqtt"
      RABBITMQ_USERNAME: "intersect_username"
      RABBITMQ_PASSWORD: "intersect_password"
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: "yes"
    healthcheck:
      test: rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    networks:
      - internal

  random-number-service:
    container_name: ihub-random-number-service
    image: ghcr.io/intersect-sdk/campaign-orchestrator/random-number-service:v0.1.4
    restart: always
    environment:
      BROKER_HOST: "ihub-broker"
      BROKER_PORT: "5672"
      BROKER_USERNAME: "intersect_username"
      BROKER_PASSWORD: "intersect_password"
      BROKER_PROTOCOL: "amqp0.9.1"
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - internal

  campaign-orchestrator:
    container_name: ihub-campaign-orchestrator
    image: ghcr.io/intersect-sdk/campaign-orchestrator:v0.1.4
    restart: always
    ports:
      - "8001:8000"
    environment:
      PRODUCTION: "true"
      API_KEY: "dev-api-key-12345678901234567890"
      BROKER_HOST: "ihub-broker"
      BROKER_PORT: "5672"
      BROKER_USERNAME: "intersect_username"
      BROKER_PASSWORD: "intersect_password"
      BROKER_PROTOCOL: "amqp0.9.1"
      CAMPAIGN_REPOSITORY_BACKEND: "memory"
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/healthcheck')",
        ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    networks:
      - internal

  server:
    container_name: ihub-server
    build:
      context: ./apps/backend/server
      target: runtime
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/openapi.json', timeout=5).raise_for_status()",
        ]
      interval: 10s
      retries: 5
      start_period: 15s
      timeout: 10s
    environment:
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      AUTH_MODE: dev_bypass
      DEV_AUTH_EMAIL: dev.user@example.com
      DEV_AUTH_NAME: "Dev User"
      PROJECT_FILE_UPLOAD_MAX_BYTES: ${PROJECT_FILE_UPLOAD_MAX_BYTES:-10485760}
      PORT: 8000
      CORS_ORIGINS: '["*"]'
      POSTGRESQL_USERNAME: ihub_username
      POSTGRESQL_PASSWORD: ihub_password
      POSTGRESQL_HOST: ihub-database
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: ihub
      REDIS_HOST: ihub-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PROTOCOL: 3
      REDIS_DECODE_RESPONSES: "True"
      MQ_URI: ${MQ_URI:-redis://ihub-redis:6379}
      KVDB_URI: ${KVDB_URI:-redis://ihub-redis:6379}
      JH_ADMIN_TOKEN: ${JUYTER_HUB_ADMIN_TOKEN}
      JH_HOST: http://ihub-jupyterhub:8000/ijupyterhub
      VERSION: DEV
      # Broker settings
      BROKER_HOST: ihub-broker
      BROKER_PORT: 5672
      BROKER_USERNAME: intersect_username
      BROKER_PASSWORD: intersect_password
      BROKER_PROTOCOL: amqp0.9.1
      # Seed broker: auto-create and connect a broker on startup
      BROKER_ENABLED: "true"
      BROKER_LABEL: ${BROKER_LABEL:-Dev INTERSECT Broker}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://ihub-campaign-orchestrator:8000}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-dev-api-key-12345678901234567890}
      # OAuth/session settings (not used with dev_bypass but required by settings model)
      SESSION_SECRET: dev-secret-changeme
      SCOPE: "openid email"
      CLIENT_ID: dev-placeholder
      CLIENT_SECRET: dev-placeholder
      keycloak_authorize_url: http://ihub-keycloak:8080/auth/realms/master/protocol/openid-connect/auth
      keycloak_token_url: http://ihub-keycloak:8080/auth/realms/master/protocol/openid-connect/token
      keycloak_jwks_url: http://ihub-keycloak:8080/auth/realms/master/protocol/openid-connect/certs
      OAUTH_REDIRECT_URL: http://localhost:8080/hub/auth
      OAUTH_CALLBACK_URL: http://localhost:8080/api/v1/auth/callback
      OAUTH_UNAUTHORIZED_REDIRECT_URL: http://localhost:8080/hub/unauthorized
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      broker:
        condition: service_healthy
    networks:
      - internal

  ui:
    container_name: ihub-ui
    build:
      context: .
      dockerfile: ./apps/frontend/hub/Dockerfile
      args:
        APP_NAME: hub
        NEXT_PUBLIC_VERSION: DEV
    environment:
      PORT: 3000
    restart: always
    ports:
      - "3000:3000"
    networks:
      - internal

  marketplace:
    container_name: ihub-marketplace
    build:
      context: .
      dockerfile: ./apps/frontend/marketplace/Dockerfile
      args:
        APP_NAME: marketplace
        NEXT_PUBLIC_VERSION: DEV
    environment:
      PORT: 3001
    restart: always
    ports:
      - "3001:3001"
    networks:
      - internal

  docs:
    container_name: ihub-docs
    build:
      context: ./apps/frontend/docs
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3002:3002"
    networks:
      - internal

  ihub-jupyterhub:
    build:
      context: ./apps/backend/jupyter_hub
      dockerfile: Dockerfile
      args:
        JUPYTERHUB_VERSION: 5.4.2
    restart: always
    container_name: ihub-jupyterhub
    networks:
      - internal
    volumes:
      # The JupyterHub configuration file
      - "./apps/backend/jupyter_hub/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro"
      # The Jupyter Server config file
      - "./apps/backend/jupyter_hub/jupyter_server_config.py:/srv/user-config/jupyter_server_config.py:ro"
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - "ihub_jupyter_data:/data"
      - "ihub_jupyter_single_user_config:/single_user_config"
    depends_on:
      projects-volume-init:
        condition: service_completed_successfully

    ports:
      - "5482:8000"
    environment:
      # This username will be a JupyterHub admin
      JUPYTERHUB_ADMIN: admin
      # All containers will join this network
      DOCKER_NETWORK_NAME: ihub_internal_network
      # JupyterHub will spawn this Notebook image for users
      # DOCKER_NOTEBOOK_IMAGE: quay.io/jupyter/scipy-notebook:hub-5.4.2
      DOCKER_NOTEBOOK_IMAGE: quay.io/jupyterhub/singleuser:5.4.2
      # Notebook directory inside user image
      DOCKER_NOTEBOOK_DIR: /home/jovyan/work
      OAUTH_CLIENT_ID: ${CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${CLIENT_SECRET}
      SCOPE: ${SCOPE}
      OAUTH_AUTHORIZE_URL: ${keycloak_authorize_url}
      OAUTH_TOKEN_URL: ${keycloak_token_url}
      OAUTH_USERDATA_URL: ${OAUTH_USERDATA_URL}
      JUPYTER_OAUTH_CALLBACK_URL: ${JUPYTER_OAUTH_CALLBACK_URL}
      JUPYTER_PUBLIC_URL: ${JUPYTER_PUBLIC_URL}
      JUPYTER_VALIDATE_CERT: ${JUPYTER_VALIDATE_CERT}
      JUPYTERHUB_SECURE_COOKIES: ${JUPYTERHUB_SECURE_COOKIES}
      JUPYTER_SECURE_COOKIES: ${JUPYTER_SECURE_COOKIES}
      AUTH_MODE: ${AUTH_MODE:-oauth}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-dev.user@example.com}
      DEV_AUTH_NAME: ${DEV_AUTH_NAME:-Local Dev User}
      JH_ADMIN_TOKEN: ${JUYTER_HUB_ADMIN_TOKEN}

  ihub-keycloak:
    container_name: ihub-keycloak
    image: quay.io/keycloak/keycloak:26.5
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_STARTING_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_STARTING_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_SPI_HTML_CONTENT_SECURITY_POLICY: frame-src 'self' localhost:8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
    networks:
      - internal
    ports:
      - "8086:8080"
    volumes:
      - ihub_keycloak_data:/opt/keycloak/data

  mcp:
    container_name: ihub-mcp
    environment:
      PORT: 8100
      IHUB_SERVER_HOST: ihub-server
      IHUB_SERVER_PORT: 8000
    build:
      context: ./apps/backend/mcp_server
      target: runtime # remove this if you want to run the tests inside the docker build
      args:
        PRODUCTION: "1" # remove this if you want to run tests or lints inside the docker build
    restart: always
    ports:
      - "8100:8100"
    networks:
      - internal

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
  internal:
    name: ihub_internal_network
    driver: bridge

volumes:
  ihub_postgresql_data:
    driver: local
  ihub_redis_data:
    driver: local
  ihub_jupyter_data:
    driver: local
  ihub_jupyter_single_user_config:
    driver: local
  ihub_keycloak_data:
    driver: local
  ihub_projects:
    driver: local
