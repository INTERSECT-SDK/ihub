[project]
name = "ihub-server"
version = "0.1.0"
description = "Default template for PDM package"
dependencies = ["fastapi[standard]>=0.135.2", "pydantic-settings>=2.6.1", "intersect-sdk-common==0.9.4", "sse-starlette>=2.1.3", "sqlmodel>=0.0.22", "alembic>=1.15.1", "psycopg[binary]>=3.2.6", "bson>=0.5.10", "pymongo>=4.14.0", "flowcept>=0.9.1", "redis[hiredis]>=6.4.0", "httpx>=0.28.1", "a2a-sdk>=1.0.0,<2.0.0", "fastmcp>=3.1.1", "websockets>=16.0", "Authlib>=1.6.5", "Starlette>=0.48.0", "itsdangerous>=2.2.0", "pyjwt>=2.10.1", "jsonref>=1.1.0", "langchain-community>=0.4.1", "langchain-core>=1.2.13", "langchain[openai]>=1.2.12", "langchain-mcp-adapters>=0.2.1", "langchain-ollama>=1.0.1", "pypdf>=6.0", "ag-ui-protocol<0.2.0,>=0.1.19", "pika>=1.3.2"]
requires-python = ">=3.12,<3.14"
readme = "README.md"

[[project.authors]]
name = "Phillipe Austria"
email = "Phillipe Austria <austriaps@ornl.gov>"

[[project.authors]]
name = "Shayan Monadjemi"
email = "Shayan Monadjemi <monadjemis@ornl.gov>"

[[project.authors]]
name = "Lance Drane"
email = "dranelt@ornl.gov"

[project.optional-dependencies]
dev = ["ruff==0.9.4", "mypy>=1.13.0", "pytest>=9.0.2", "pytest-cov>=5.0.0"]

[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = ["ruff==0.9.4", "mypy>=1.13.0", "pytest>=9.0.2", "pytest-cov>=5.0.0"]

[tool.pdm.scripts]
format = "ruff format"
lint-ruff = "ruff check --fix"
lint-mypy = "mypy ihub_server/"
test = "pytest"
test-coverage = "pytest --cov=ihub_server --cov-report=term --cov-report=json:coverage.json"
coverage-services = "python -m ihub_server.tools.service_coverage --coverage-file coverage.json --threshold 90"
retire-guest-jupyter-access = "python -m ihub_server.tools.retire_guest_jupyter_access"

[tool.pdm.scripts.dev]
env_file = ".env"
cmd = "python -m ihub_server.dev_server"

[tool.pdm.scripts.start]
env_file = ".env"
cmd = "uvicorn ihub_server.main:app --host 0.0.0.0 --port ${PORT}"

[tool.pdm.scripts.lint]
composite = ["lint-ruff", "lint-mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=ihub_server --cov-report=term"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
extend-select = ["C90", "I", "N", "UP", "YTT", "ASYNC", "S", "BLE", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TCH", "ARG", "PTH", "PGH", "PL", "TRY", "FLY", "RUF"]
ignore = ["COM812", "ISC001", "SIM105", "ANN401", "PLR2004", "RET504"]

[tool.ruff.lint.isort]
known-first-party = ["ihub_server"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-returns = 10
max-statements = 75

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"docs/*" = ["D", "INP001"]
"migrations/*" = ["INP001", "N999"]
"tests/*" = ["ALL"]
"ihub_server/tools/*" = ["ALL"]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
