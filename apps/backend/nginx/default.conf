map $http_upgrade $jupyter_sec_fetch_mode {
  default $http_sec_fetch_mode;
  ~*websocket websocket;
}

server {
    listen 80;
    server_name __NGINX_SERVER_NAME__;
    return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name __NGINX_SERVER_NAME__;
  ssl_certificate /run/secrets/tls_certificate;
  ssl_certificate_key /run/secrets/tls_private_key;
  keepalive_timeout 70;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # password protection (temporary)
  # auth_basic "Restricted Access";
  # auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

  location /hub {
    proxy_pass http://ihub-ui:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Origin "";
  }

  location /ijupyterhub/ {
    client_max_body_size __PROJECT_FILE_EDITOR_MAX_BODY_BYTES__;
    proxy_pass http://ihub-jupyterhub:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Sec-Fetch-Mode $jupyter_sec_fetch_mode;

    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  location /docs/ {
    proxy_pass http://ihub-docs:3002/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://ihub-marketplace:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $remote_addr;
  }

  location /api {
      client_max_body_size __PROJECT_FILE_UPLOAD_MAX_BODY_BYTES__;
      proxy_pass http://ihub-server:8000/api;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-NginX-Proxy true;

      # WebSocket support
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;

      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_buffering off;
  }

  location /api-docs {
      proxy_pass http://ihub-server:8000/docs;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-NginX-Proxy true;
  }

  location /openapi.json {
    proxy_pass http://ihub-server:8000/openapi.json;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
  }

  # Proxy the Ollama service included in the production Compose stack.
  location /ihub_ollama/ {
    proxy_pass http://ihub-ollama:11434/;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
  }

  location /ihub_mcp/ {
    proxy_pass http://ihub-mcp:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
  }

  location /lotf_mcp_damara/ {
    proxy_pass http://host.docker.internal:8201/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
  }

  location /lotf_mcp_mbe_dev/ {
    proxy_pass http://host.docker.internal:8202/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
  }

  location /lotf_mcp_mbe_prod/ {
    proxy_pass http://host.docker.internal:8203/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
  }

}
